<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travia — Login</title>
  <link rel="stylesheet" href="shared/theme/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand">Travia</a>
  </nav>

  <main class="auth-page">
    <div class="card auth-card">
      <h1 id="title">تسجيل الدخول</h1>
      <form id="login-form">
        <label id="lbl-email" for="email">البريد</label>
        <input type="email" id="email" required autocomplete="email" />
        <label id="lbl-password" for="password">كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <button class="btn btn-block" type="submit" id="btn-login">دخول</button>
      </form>
      <p class="error" id="err"></p>
      <p class="auth-links">
        <a href="register.html" id="link-register">حساب جديد</a>
        ·
        <a href="index.html" id="link-search">البحث</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { loadLocale, t, locale } from "./shared/i18n/index.js";
    import { login } from "./js/client-auth.js";

    await loadLocale(locale);
    document.getElementById("title").textContent = t("auth.login");
    document.getElementById("lbl-email").textContent = t("auth.email");
    document.getElementById("lbl-password").textContent = t("auth.password");
    document.getElementById("btn-login").textContent = t("auth.login");
    document.getElementById("link-register").textContent = t("auth.register");
    document.getElementById("link-search").textContent = t("search.title");

    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await login(document.getElementById("email").value, document.getElementById("password").value);
        location.href = "index.html";
      } catch (ex) {
        document.getElementById("err").textContent = ex.message;
      }
    };
  </script>
</body>
</html>
