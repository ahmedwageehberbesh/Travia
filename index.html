<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travia — معاك كام؟</title>
  <link rel="stylesheet" href="shared/theme/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="hero-shell">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-bg-layer layer-a is-visible"></div>
      <div class="hero-bg-layer layer-b"></div>
    </div>
    <div class="hero-bg-overlay" aria-hidden="true"></div>

    <nav class="nav nav-hero">
      <span class="nav-brand" id="app-name">Travia</span>
      <div class="nav-actions">
        <span class="demo-badge" id="demo-badge">عرض تجريبي</span>
        <button id="gemini-settings-btn" class="btn btn-secondary btn-glass gemini-btn" type="button" title="Gemini">✨ Gemini</button>
        <button id="lang-toggle" class="btn btn-secondary btn-glass" type="button">EN</button>
        <a href="login.html" id="auth-link" class="btn btn-secondary btn-glass" style="text-decoration:none">تسجيل الدخول</a>
      </div>
    </nav>

    <main class="container hero-main">
      <section class="hero">
        <p class="hero-city-badge" id="hero-city-name">جنوب سيناء</p>
        <p class="hero-subtitle" id="hero-subtitle">ادخل ميزانيتك ونبني لك رحلة كاملة</p>
      </section>

      <section id="search-section" class="card search-card">
        <h1 id="search-title">معاك كام؟</h1>
        <p class="demo-hint" id="demo-hint">بيانات تجريبية — اشتغل عادي بدون باك‌اند</p>

        <form id="search-form">
          <input type="hidden" id="city_slug" name="city_slug" value="south_sinai" />

          <details class="picker-details" id="city-picker">
            <summary class="picker-trigger" id="city-trigger">
              <img class="picker-trigger-thumb" id="city-trigger-thumb" src="https://images.unsplash.com/photo-1580831388967-965a807c5b57?auto=format&fit=crop&w=80&q=80" alt="جنوب سيناء" />
              <span class="picker-trigger-text" id="city-trigger-label">جنوب سيناء</span>
              <span class="picker-chevron" aria-hidden="true">▾</span>
            </summary>
            <div class="picker-panel" id="city-panel">
              <p class="picker-panel-title" data-i18n="search.pick_city">اختار الوجهة</p>
              <div class="picker-grid picker-grid-governorate" id="city-grid">
                <button type="button" class="picker-card" data-value="cairo"><img class="picker-card-img" src="https://images.unsplash.com/photo-1572252002811-b253801674ce?auto=format&fit=crop&w=200&q=80" alt="القاهرة" loading="lazy" /><span class="picker-card-label">القاهرة</span></button>
                <button type="button" class="picker-card" data-value="giza"><img class="picker-card-img" src="https://images.unsplash.com/photo-1572252002811-b253801674ce?auto=format&fit=crop&w=200&q=80" alt="الجيزة" loading="lazy" /><span class="picker-card-label">الجيزة</span></button>
                <button type="button" class="picker-card" data-value="alexandria"><img class="picker-card-img" src="https://images.unsplash.com/photo-1569163139599-0b0bc06e2e0c?auto=format&fit=crop&w=200&q=80" alt="الإسكندرية" loading="lazy" /><span class="picker-card-label">الإسكندرية</span></button>
                <button type="button" class="picker-card" data-value="red_sea"><img class="picker-card-img" src="https://images.unsplash.com/photo-1544551763-77ef2d0cfc6c?auto=format&fit=crop&w=200&q=80" alt="البحر الأحمر" loading="lazy" /><span class="picker-card-label">البحر الأحمر</span></button>
                <button type="button" class="picker-card" data-value="luxor"><img class="picker-card-img" src="https://images.unsplash.com/photo-1568320561449-1f775838d0f7?auto=format&fit=crop&w=200&q=80" alt="الأقصر" loading="lazy" /><span class="picker-card-label">الأقصر</span></button>
                <button type="button" class="picker-card" data-value="aswan"><img class="picker-card-img" src="https://images.unsplash.com/photo-1613395877788-f243461148bb?auto=format&fit=crop&w=200&q=80" alt="أسوان" loading="lazy" /><span class="picker-card-label">أسوان</span></button>
                <button type="button" class="picker-card" data-value="matrouh"><img class="picker-card-img" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=200&q=80" alt="مطروح" loading="lazy" /><span class="picker-card-label">مطروح</span></button>
                <button type="button" class="picker-card" data-value="new_valley"><img class="picker-card-img" src="https://images.unsplash.com/photo-1509316785289-025f5b846b8f?auto=format&fit=crop&w=200&q=80" alt="الوادي الجديد" loading="lazy" /><span class="picker-card-label">الوادي الجديد</span></button>
                <button type="button" class="picker-card is-selected" data-value="south_sinai"><img class="picker-card-img" src="https://images.unsplash.com/photo-1580831388967-965a807c5b57?auto=format&fit=crop&w=200&q=80" alt="جنوب سيناء" loading="lazy" /><span class="picker-card-label">جنوب سيناء</span></button>
              </div>
            </div>
          </details>

          <div class="budget-field">
            <label id="lbl-budget" for="budget">الميزانية (جنيه)</label>
            <div class="budget-input-wrap">
              <input type="number" id="budget" min="3000" value="20000" required aria-label="Budget" />
              <span class="currency">EGP</span>
            </div>
          </div>

          <div class="form-row">
            <div>
              <label id="lbl-people" for="people">عدد الأشخاص</label>
              <input type="number" id="people" min="1" value="2" required />
            </div>
            <div>
              <label id="lbl-duration" for="duration">مدة الرحلة (أيام)</label>
              <input type="number" id="duration" min="1" max="30" value="5" required />
            </div>
          </div>

          <details class="picker-details" id="trip-type-picker">
            <summary class="picker-trigger" id="trip-type-trigger">
              <span class="picker-trigger-text" id="trip-type-trigger-label">بحر · استجمام</span>
              <span class="picker-chevron" aria-hidden="true">▾</span>
            </summary>
            <div class="picker-panel" id="trip-type-panel">
              <p class="picker-panel-title" data-i18n="search.pick_trip">اختار نوع الرحلة</p>
              <div class="picker-grid picker-grid-trip" id="trip-type-grid">
                <button type="button" class="picker-card picker-card-trip is-selected" data-value="SEA"><img class="picker-card-img" src="https://images.unsplash.com/photo-1559827260-dc66d52bef19?auto=format&fit=crop&w=320&q=80" alt="بحر" loading="lazy" /><span class="picker-card-label">بحر</span><span class="picker-check" aria-hidden="true">✓</span></button>
                <button type="button" class="picker-card picker-card-trip is-selected" data-value="RELAXATION"><img class="picker-card-img" src="https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=320&q=80" alt="استجمام" loading="lazy" /><span class="picker-card-label">استجمام</span><span class="picker-check" aria-hidden="true">✓</span></button>
                <button type="button" class="picker-card picker-card-trip" data-value="ADVENTURE"><img class="picker-card-img" src="https://images.unsplash.com/photo-1509316785289-025f5b846b8f?auto=format&fit=crop&w=320&q=80" alt="مغامرات" loading="lazy" /><span class="picker-card-label">مغامرات</span><span class="picker-check" aria-hidden="true">✓</span></button>
                <button type="button" class="picker-card picker-card-trip" data-value="HERITAGE"><img class="picker-card-img" src="https://images.unsplash.com/photo-1568320561449-1f775838d0f7?auto=format&fit=crop&w=320&q=80" alt="آثار" loading="lazy" /><span class="picker-card-label">آثار</span><span class="picker-check" aria-hidden="true">✓</span></button>
                <button type="button" class="picker-card picker-card-trip" data-value="HONEYMOON"><img class="picker-card-img" src="https://images.unsplash.com/photo-1567899378494-47b059425544?auto=format&fit=crop&w=320&q=80" alt="شهر عسل" loading="lazy" /><span class="picker-card-label">شهر عسل</span><span class="picker-check" aria-hidden="true">✓</span></button>
              </div>
            </div>
          </details>

          <button type="submit" class="btn btn-block" id="btn-search">اللي يناسب ميزانيتك</button>
        </form>
        <p class="error" id="search-error"></p>
      </section>
    </main>
  </div>

  <section id="results-section" class="container hidden"></section>

  <div id="gemini-modal" class="modal hidden" role="dialog" aria-labelledby="gemini-modal-title">
    <div class="modal-card card">
      <h2 id="gemini-modal-title" data-i18n="gemini.settings_title">ربط Gemini</h2>
      <p class="modal-desc" data-i18n="gemini.settings_desc">اختياري — الداتا التجريبية شغالة بدونه.</p>
      <p id="gemini-status" class="gemini-status"></p>
      <label for="gemini-api-key" data-i18n="gemini.api_key">مفتاح API</label>
      <input type="password" id="gemini-api-key" autocomplete="off" placeholder="AIza..." />
      <p class="error" id="gemini-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="gemini-save" data-i18n="gemini.save">حفظ</button>
        <button type="button" class="btn btn-secondary" id="gemini-clear" data-i18n="gemini.clear">مسح</button>
        <button type="button" class="btn btn-secondary" id="gemini-close" data-i18n="gemini.close">إغلاق</button>
      </div>
      <p class="gemini-note" data-i18n="gemini.note">المفتاح يُحفظ محلياً فقط.</p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
