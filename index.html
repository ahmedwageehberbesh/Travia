<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Travia — معاك كام؟</title>
  <link rel="stylesheet" href="shared/theme/variables.css" />
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <div class="hero-shell">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-bg-layer layer-a is-visible"></div>
      <div class="hero-bg-layer layer-b"></div>
    </div>
    <div class="hero-bg-overlay" aria-hidden="true"></div>

    <nav class="nav nav-hero">
      <span class="nav-brand" id="app-name">Travia</span>
      <div class="nav-actions">
        <span class="demo-badge" id="demo-badge">عرض تجريبي</span>
        <button id="gemini-settings-btn" class="btn btn-secondary btn-glass gemini-btn" type="button" title="Gemini">✨ Gemini</button>
        <button id="lang-toggle" class="btn btn-secondary btn-glass" type="button">EN</button>
        <a href="login.html" id="auth-link" class="btn btn-secondary btn-glass" style="text-decoration:none">تسجيل الدخول</a>
      </div>
    </nav>

    <main class="container hero-main">
      <section class="hero">
        <p class="hero-city-badge" id="hero-city-name">جنوب سيناء</p>
        <p class="hero-subtitle" id="hero-subtitle">ادخل ميزانيتك ونبني لك رحلة كاملة</p>
      </section>

      <section id="search-section" class="card search-card">
        <h1 id="search-title">معاك كام؟</h1>
        <p class="demo-hint" id="demo-hint">اربط Gemini وابحث — الخطط بتتولّد بالذكاء الاصطناعي</p>

        <form id="search-form">
          <input type="hidden" id="city_slug" name="city_slug" value="south_sinai" />

          <div class="form-field">
            <label id="lbl-city" data-i18n="search.city">الوجهة</label>
            <div class="picker-grid picker-grid-governorate" id="city-grid">
              <button type="button" class="city-chip" data-value="cairo"><span class="city-chip-dot" style="background:#C4A35A;border-color:#8B6914"></span><span class="city-chip-label">القاهرة</span></button>
              <button type="button" class="city-chip" data-value="giza"><span class="city-chip-dot" style="background:#D4A574;border-color:#9A6B3A"></span><span class="city-chip-label">الجيزة</span></button>
              <button type="button" class="city-chip" data-value="alexandria"><span class="city-chip-dot" style="background:#2E86AB;border-color:#1A5276"></span><span class="city-chip-label">الإسكندرية</span></button>
              <button type="button" class="city-chip" data-value="dakahlia"><span class="city-chip-dot" style="background:#52B788;border-color:#2D6A4F"></span><span class="city-chip-label">الدقهلية</span></button>
              <button type="button" class="city-chip" data-value="sharqia"><span class="city-chip-dot" style="background:#74C69D;border-color:#40916C"></span><span class="city-chip-label">الشرقية</span></button>
              <button type="button" class="city-chip" data-value="qalyubia"><span class="city-chip-dot" style="background:#95D5B2;border-color:#52B788"></span><span class="city-chip-label">القليوبية</span></button>
              <button type="button" class="city-chip" data-value="gharbia"><span class="city-chip-dot" style="background:#B7E4C7;border-color:#52B788"></span><span class="city-chip-label">الغربية</span></button>
              <button type="button" class="city-chip" data-value="monufia"><span class="city-chip-dot" style="background:#A8DADC;border-color:#457B9D"></span><span class="city-chip-label">المنوفية</span></button>
              <button type="button" class="city-chip" data-value="beheira"><span class="city-chip-dot" style="background:#4895EF;border-color:#1D3557"></span><span class="city-chip-label">البحيرة</span></button>
              <button type="button" class="city-chip" data-value="kafr_el_sheikh"><span class="city-chip-dot" style="background:#4CC9F0;border-color:#0077B6"></span><span class="city-chip-label">كفر الشيخ</span></button>
              <button type="button" class="city-chip" data-value="damietta"><span class="city-chip-dot" style="background:#5C80BC;border-color:#293241"></span><span class="city-chip-label">دمياط</span></button>
              <button type="button" class="city-chip" data-value="port_said"><span class="city-chip-dot" style="background:#3A86FF;border-color:#023E8A"></span><span class="city-chip-label">بورسعيد</span></button>
              <button type="button" class="city-chip" data-value="ismailia"><span class="city-chip-dot" style="background:#48CAE4;border-color:#0096C7"></span><span class="city-chip-label">الإسماعيلية</span></button>
              <button type="button" class="city-chip" data-value="suez"><span class="city-chip-dot" style="background:#0096C7;border-color:#03045E"></span><span class="city-chip-label">السويس</span></button>
              <button type="button" class="city-chip" data-value="fayoum"><span class="city-chip-dot" style="background:#6A994E;border-color:#386641"></span><span class="city-chip-label">الفيوم</span></button>
              <button type="button" class="city-chip" data-value="beni_suef"><span class="city-chip-dot" style="background:#BC6C25;border-color:#7F4F24"></span><span class="city-chip-label">بني سويف</span></button>
              <button type="button" class="city-chip" data-value="minya"><span class="city-chip-dot" style="background:#E09F3E;border-color:#9A3412"></span><span class="city-chip-label">المنيا</span></button>
              <button type="button" class="city-chip" data-value="assiut"><span class="city-chip-dot" style="background:#DDA15E;border-color:#BC6C25"></span><span class="city-chip-label">أسيوط</span></button>
              <button type="button" class="city-chip" data-value="sohag"><span class="city-chip-dot" style="background:#E76F51;border-color:#AE2012"></span><span class="city-chip-label">سوهاج</span></button>
              <button type="button" class="city-chip" data-value="qena"><span class="city-chip-dot" style="background:#F4A261;border-color:#E76F51"></span><span class="city-chip-label">قنا</span></button>
              <button type="button" class="city-chip" data-value="luxor"><span class="city-chip-dot" style="background:#E67E22;border-color:#A04000"></span><span class="city-chip-label">الأقصر</span></button>
              <button type="button" class="city-chip" data-value="aswan"><span class="city-chip-dot" style="background:#3498DB;border-color:#1A5276"></span><span class="city-chip-label">أسوان</span></button>
              <button type="button" class="city-chip" data-value="red_sea"><span class="city-chip-dot" style="background:#FF6B6B;border-color:#C0392B"></span><span class="city-chip-label">البحر الأحمر</span></button>
              <button type="button" class="city-chip" data-value="new_valley"><span class="city-chip-dot" style="background:#F1C40F;border-color:#B7950B"></span><span class="city-chip-label">الوادي الجديد</span></button>
              <button type="button" class="city-chip" data-value="matrouh"><span class="city-chip-dot" style="background:#1ABC9C;border-color:#117A65"></span><span class="city-chip-label">مطروح</span></button>
              <button type="button" class="city-chip" data-value="north_sinai"><span class="city-chip-dot" style="background:#E8C547;border-color:#9A7B0A"></span><span class="city-chip-label">شمال سيناء</span></button>
              <button type="button" class="city-chip is-selected" data-value="south_sinai"><span class="city-chip-dot" style="background:#40E0D0;border-color:#008B8B"></span><span class="city-chip-label">جنوب سيناء</span></button>
            </div>
          </div>

          <div class="budget-field">
            <label id="lbl-budget" for="budget">الميزانية (جنيه)</label>
            <div class="budget-input-wrap">
              <input type="number" id="budget" min="3000" value="20000" required aria-label="Budget" />
              <span class="currency">EGP</span>
            </div>
          </div>

          <div class="form-row">
            <div>
              <label id="lbl-people" for="people">عدد الأشخاص</label>
              <input type="number" id="people" min="1" value="2" required />
            </div>
            <div>
              <label id="lbl-duration" for="duration">مدة الرحلة (أيام)</label>
              <input type="number" id="duration" min="1" max="30" value="5" required />
            </div>
          </div>

          <div class="form-field">
            <label id="lbl-trip-types" data-i18n="search.trip_types">نوع الرحلة</label>
            <div class="picker-grid picker-grid-chips" id="trip-type-grid">
              <button type="button" class="picker-chip is-selected" data-value="SEA"><span class="picker-chip-label">بحر</span><span class="picker-check" aria-hidden="true">✓</span></button>
              <button type="button" class="picker-chip is-selected" data-value="RELAXATION"><span class="picker-chip-label">استجمام</span><span class="picker-check" aria-hidden="true">✓</span></button>
              <button type="button" class="picker-chip" data-value="ADVENTURE"><span class="picker-chip-label">مغامرات</span><span class="picker-check" aria-hidden="true">✓</span></button>
              <button type="button" class="picker-chip" data-value="HERITAGE"><span class="picker-chip-label">آثار</span><span class="picker-check" aria-hidden="true">✓</span></button>
              <button type="button" class="picker-chip" data-value="HONEYMOON"><span class="picker-chip-label">شهر عسل</span><span class="picker-check" aria-hidden="true">✓</span></button>
            </div>
          </div>

          <button type="submit" class="btn btn-block" id="btn-search">اللي يناسب ميزانيتك</button>
        </form>
        <p class="error" id="search-error"></p>
      </section>
    </main>
  </div>

  <section id="results-section" class="container hidden"></section>

  <div id="gemini-modal" class="modal hidden" role="dialog" aria-labelledby="gemini-modal-title">
    <div class="modal-card card">
      <h2 id="gemini-modal-title" data-i18n="gemini.settings_title">ربط Gemini</h2>
      <p class="modal-desc" data-i18n="gemini.settings_desc">مطلوب لتوليد خطط الرحلة — المفتاح يُحفظ محلياً.</p>
      <p id="gemini-status" class="gemini-status"></p>
      <label for="gemini-api-key" data-i18n="gemini.api_key">مفتاح API</label>
      <input type="password" id="gemini-api-key" autocomplete="off" placeholder="AIza..." />
      <p class="error" id="gemini-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="gemini-save" data-i18n="gemini.save">حفظ</button>
        <button type="button" class="btn btn-secondary" id="gemini-clear" data-i18n="gemini.clear">مسح</button>
        <button type="button" class="btn btn-secondary" id="gemini-close" data-i18n="gemini.close">إغلاق</button>
      </div>
      <p class="gemini-note" data-i18n="gemini.note">المفتاح يُحفظ محلياً فقط.</p>
    </div>
  </div>

  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
